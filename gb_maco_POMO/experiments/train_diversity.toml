# 启动：python -m gb_maco_POMO.experiments.train --config gb_maco_POMO/experiments/train_diversity.toml
# 与原模型同一 Soft POMO 结构、数据和 CUDA 设置；resume 留空以新建独立 run。
[training]
epochs = 35
batch_size = 64
micro_batch_size = 8
learning_rate = 0.0001
seed = 42

[model]
embedding_dim = 128
encoder_layers = 3
num_heads = 8
candidate_mode = "soft"
same_ball_bias = 2.0
adjacent_ball_bias = 1.0

[validation]
interval = 4
batch_size = 64

[data]
root = "../../benachmark_Train_MATSP_500"
train_dir = "train"
validation_dir = "validation"

[checkpoint]
save_interval = 20
resume = ""

[runtime]
device = "cuda"

[output]
results_root = "../results/diversity_reward"
checkpoints_root = "../results/checkpoints/diversity_reward"

[reward]
mode = "diversity"
quality_ratio = 1.02
lambda = 0.01
warmup_epochs = 5
ramp_epochs = 5
